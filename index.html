<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a5a">
<title>Mi Plato</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f3f6f4;--card:#fff;--fg:#17211c;--muted:#5d6b63;--line:#dbe3de;--accent:#1f7a5a;--accent-fg:#fff;--prot:#b35f12;--warn:#a33a2a;--soft:#e7efe9}
@media (prefers-color-scheme:dark){:root{--bg:#0f1512;--card:#18211c;--fg:#e7eee9;--muted:#97a69d;--line:#2a352f;--accent:#3fb489;--accent-fg:#06140e;--prot:#e39a52;--warn:#f08a78;--soft:#22302a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-left)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right));display:grid;gap:14px}
h1{font-size:20px;margin:4px 0 0}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.bar{height:14px;border-radius:7px;background:var(--soft);overflow:hidden;margin:6px 0 2px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:7px}
.bar.prot>i{background:var(--prot)}
.big{font-size:22px;font-weight:700}
textarea,input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
textarea{min-height:110px;resize:vertical;font-size:18px}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;min-height:48px;cursor:pointer;background:var(--soft);color:var(--fg)}
button.primary{background:var(--accent);color:var(--accent-fg);font-weight:700}
button.full{width:100%}
button.link{background:none;min-height:40px;padding:8px;color:var(--muted)}
button:disabled{opacity:.5}
.item{display:grid;grid-template-columns:1fr 74px 64px 40px;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.item input{padding:8px;text-align:right}
.item button{min-height:40px;padding:0}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--soft);color:var(--muted)}
.badge.est{color:var(--prot)}
.meal{padding:10px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.err{color:var(--warn)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border-radius:0;background:none;min-height:60px;color:var(--muted);font-weight:600}
nav button[aria-current="page"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
svg{width:100%;height:auto;display:block}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <section id="v-hoy"></section>
  <section id="v-peso" hidden></section>
  <section id="v-ajustes" hidden></section>
</main>
<nav>
  <button data-tab="hoy" aria-current="page">Hoy</button>
  <button data-tab="peso">Peso</button>
  <button data-tab="ajustes">Ajustes</button>
</nav>
<script src="app.js"></script>
</body>
</html>
